name: Prepare draft release artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Verify draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify runtime and project
        run: |
          (cd public/libav-patentfree && sha256sum --check SOURCES.sha256)
          npm run typecheck
          npm test
          npm run format:check
      - name: Create release artifacts
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir release
          (cd packages/videojs-libav && npm pack --pack-destination "$GITHUB_WORKSPACE/release")
          ./scripts/package-corresponding-source.sh release "$RELEASE_TAG"
          (cd release && sha256sum * > SHA256SUMS)
      - name: Upload artifacts to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber
