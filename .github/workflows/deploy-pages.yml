name: Deploy released demo to GitHub Pages

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify runtime checksums
        run: sha256sum --check SOURCES.sha256
        working-directory: public/libav-patentfree
      - name: Verify project
        run: npm run typecheck && npm test && npm run format:check
      - name: Add direct corresponding-source link
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: node scripts/write-release-source-link.mjs "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build demo
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
