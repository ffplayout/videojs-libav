name: Release and deploy demo to GitHub Pages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to package, release, and deploy
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify runtime checksums
        run: sha256sum --check SOURCES.sha256
        working-directory: public/libav-patentfree
      - name: Verify project
        run: npm run typecheck && npm test && npm run format:check
      - name: Verify tag matches package version
        run: |
          package_version=$(node -p "require('./packages/videojs-libav/package.json').version")
          test "$RELEASE_TAG" = "v$package_version"
      - name: Create release artifacts
        run: |
          mkdir release
          (cd packages/videojs-libav && npm pack --pack-destination "$GITHUB_WORKSPACE/release")
          ./scripts/package-runtime.sh release "$RELEASE_TAG"
          ./scripts/package-corresponding-source.sh release "$RELEASE_TAG"
          (cd release && sha256sum * > SHA256SUMS)
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false
      - name: Add direct corresponding-source link
        run: node scripts/write-release-source-link.mjs "$GITHUB_REPOSITORY" "$RELEASE_TAG"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build demo
        run: npm run build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
